<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 flex-grow-1">
        <h2 class="mb-4">Dashboard</h2>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h6 class="card-title">Tong so san pham</h6>
                        <h2 th:text="${totalProducts}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h6 class="card-title">Tong so nguoi dung</h6>
                        <h2 th:text="${totalUsers}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <h5>San pham gan day</h5>
        <table class="table table-striped table-bordered bg-white">
            <thead>
            <tr>
                <th>ID</th>
                <th>Ten</th>
                <th>Danh muc</th>
                <th>Gia</th>
                <th>Ton kho</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${recentProducts}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.category}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
