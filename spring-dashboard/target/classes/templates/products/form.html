<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id} != null ? 'Sua san pham' : 'Them san pham'">Form san pham</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 flex-grow-1" style="max-width:600px;">
        <h2 th:text="${product.id} != null ? 'Sua san pham' : 'Them san pham'">Form</h2>

        <form th:action="@{/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Tên sản phẩm</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Danh mục</label>
                <input type="text" th:field="*{category}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Giá</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Số lượng tồn kho</label>
                <input type="number" th:field="*{quantity}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Lưu</button>
            <a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</div>
</body>
</html>
