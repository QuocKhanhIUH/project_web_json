<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang nhap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="width:100%; max-width:400px;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Dang nhap</h3>

            <div class="alert alert-danger" th:if="${param.error}">
                Sai username hoac password!
            </div>
            <div class="alert alert-success" th:if="${param.registered}">
                Dang ky thanh cong! Vui long dang nhap.
            </div>
            <div class="alert alert-info" th:if="${param.logout}">
                Ban da dang xuat.
            </div>

            <form th:action="@{/signin}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Dang nhap</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Chua co tai khoan? <a th:href="@{/signup}">Dang ky</a>
            </p>
            <!-- <p class="text-center text-muted small mt-2">
                Tai khoan mau: admin/123456 (ADMIN) hoac user1/123456 (USER)
            </p> -->
        </div>
    </div>
</div>
</body>
</html>
