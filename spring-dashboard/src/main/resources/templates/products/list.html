<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>San pham</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="p-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Danh sách sản phẩm</h2>
            <a th:href="@{/products/add}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">+ Thêm sản phẩm mới</a>
        </div>

        <form th:action="@{/products}" method="get" class="mb-3 d-flex gap-2" style="max-width:400px;">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tim theo ten san pham...">
            <button type="submit" class="btn btn-outline-primary">Tìm</button>
        </form>

        <table class="table table-striped table-bordered bg-white">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên Sản Phẩm</th>
                <th>Danh mục</th>
                <th>Giá</th>
                <th>Tồn kho</th>
                <th sec:authorize="hasRole('ADMIN')">Hành Động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.category}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Sua</a>
                    <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Xoa san pham nay?')">Xóa</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="text-center text-muted">Không có sản phẩm nào!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
